    questions:
      - id: 1
        blank_count: 6
        question: >-
          インターネットなどのコンピュータネットワークでは、画像や動画、Webページなどの大きなデータをそのまま一つのまとまりとして送信するのではなく、一定の大きさに分割して送信する方式が用いられている。分割されたデータの一つ一つは；パケット；と呼ばれ、パケットにはデータ本体に加えて、通信相手を識別するための；送信元；や；宛先；、データの順序を判断するための情報などが付加される。このようなデータ本体以外の情報をまとめた部分を；ヘッダ；という。

          パケットは、送信元のコンピュータから宛先のコンピュータまで、必ずしも同じ経路を通るとは限らない。ネットワーク上の；ルータ；は、パケットに含まれる宛先情報を確認し、そのパケットを次にどの方向へ転送するかを判断する。この仕組みにより、ネットワークの一部で障害が発生した場合でも、別の経路を利用して通信を継続できる場合がある。

          また、パケットがネットワーク上で失われたり、異なる順序で到着したりする可能性もある。そのため、受信側ではパケットに付加された情報を利用して、それぞれのパケットを正しく処理し、必要に応じて元のデータを；再構成；する。このように、データをパケットに分割して送信することで、ネットワークを効率的かつ柔軟に利用できる。
