<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/edit.css">
  <title>Arcana | Edit</title>
</head>

<body>
  <main x-data="main">
    <section class="edit-header">header</section>

    <section class="edit-directory" x-data="directory">
      <template x-for="subject in subjects">
        <div
          class="edit-directory__item"
          :class="{'current': subject.id === currentSubject?.id, 'editing': editingSubjectId === subject.id}"
          @click="selectSubject(subject.id)"
          @dblclick="startEditingName(subject.id)">
          <span x-text="subject.name" x-show="editingSubjectId !== subject.id"></span>
          <input
            type="text"
            :class="{'editing': editingSubjectId === subject.id}"
            x-model="subject.name"
            x-show="editingSubjectId === subject.id"
            @click.outside="finishEditingName()"
            @keydown.enter="finishEditingName()">
        </div>
      </template>
    </section>

    <section class="edit-main" x-data="edit">
      <textarea class="edit-main__textarea" x-model="content" @input="inputContent()"></textarea>
    </section>
  </main>

  <aside class="shortcut-bar" x-data="shortcutBar">
    <template x-for="shortcut in shortcuts" :key="shortcut.key">
      <div class="shortcut-item">
        <kbd x-text="shortcut.kbd"></kbd>
        <span x-text="shortcut.description"></span>
      </div>
    </template>
  </aside>

  <script type="module" src="../assets/js/edit.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
