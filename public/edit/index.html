<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/edit.css">
  <title>Arcana | Edit</title>
</head>

<body>
  <main x-data="main">
    <section class="edit-header">header</section>

    <section class="edit-directory">
      <div class="edit-directory__item">国語</div>
      <div class="edit-directory__item current">国語</div>
      <div class="edit-directory__item">国語</div>
      <div class="edit-directory__item">国語</div>
    </section>

    <section class="edit-main">
      <textarea class="edit-main__textarea"></textarea>
    </section>
  </main>

  <aside class="shortcut-bar" x-data="shortcutBar">
    <template x-for="shortcut in shortcuts" :key="shortcut.key">
      <div class="shortcut-item">
        <kbd x-text="shortcut.kbd"></kbd>
        <span x-text="shortcut.description"></span>
      </div>
    </template>
  </aside>

  <script type="module" src="../assets/js/edit.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
