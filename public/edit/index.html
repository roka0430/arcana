<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/edit.css">
  <title>Arcana | Edit</title>
</head>

<body>
  <main x-data="main">
    <section class="edit-header" x-data="header">
      <div class="edit-header__category" @click.outside="isOpen = false">
        <button class="current-category" :class="{'is-open': isOpen}" @click="isOpen = !isOpen">
          <span class="current-category__name" x-text="currentCategory?.name"></span>
          <svg class="current-category__dropdown-indicator" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-selector">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M8 9l4 -4l4 4" />
            <path d="M16 15l-4 4l-4 -4" />
          </svg>
        </button>

        <div class="category-dropdown" x-show="isOpen" x-cloak>
          <div class="category-dropdown__label">Select category</div>
          <div class="category-dropdown__options">
            <template x-for="category in categories">
              <div x-text="category.name" :class="{ 'current': currentCategory?.id === category.id }" @click="selectCategory(category.id)"></div>
            </template>
          </div>
        </div>
      </div>

      <div class="edit-header__info">
        <span x-text="currentSubject?.character_count"></span>
        (
        <span x-text="currentSubjectCharacterRatio"></span>%
        )
        /
        <span x-text="currentCategory?.character_count"></span>
      </div>
      <a href="/edit/category" class="edit-header__category-edit">
        <svg class="edit-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pencil">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
          <path d="M13.5 6.5l4 4" />
        </svg>
      </a>
    </section>

    <section class="edit-directory" x-data="directory">
      <div class="edit-directory__header">
        <button class="directory-header__button directory-header__create" @click="createSubject()" title="新しい科目を作成する">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-file-plus">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M14 3v4a1 1 0 0 0 1 1h4" />
            <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
            <path d="M12 11l0 6" />
            <path d="M9 14l6 0" />
          </svg>
        </button>
        <button class="directory-header__button directory-header__delete" @click="deleteSubject()" title="科目を削除する">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash-x">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M4 7h16" />
            <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
            <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            <path d="M10 12l4 4m0 -4l-4 4" />
          </svg>
        </button>
      </div>
      <div class="edit-directory__content">
        <template x-for="subject in subjects">
          <div
            class="edit-directory__item"
            :class="{'current': subject.id === currentSubject?.id, 'editing': editingSubjectId === subject.id}"
            @click="selectSubject(subject.id)"
            @dblclick="startEditingName(subject.id)">
            <span x-text="subject.name" x-show="editingSubjectId !== subject.id"></span>
            <input
              type="text"
              :class="{'editing': editingSubjectId === subject.id}"
              x-model="subject.name"
              x-show="editingSubjectId === subject.id"
              @click.outside="finishEditingName()"
              @keydown.enter="finishEditingName()">
          </div>
        </template>
      </div>
    </section>

    <section class="edit-main" x-data="edit">
      <textarea class="edit-main__textarea" x-model="content" @input="inputContent()"></textarea>
    </section>
  </main>

  <aside class="shortcut-bar" x-data="shortcutBar">
    <template x-for="shortcut in shortcuts" :key="shortcut.key">
      <div class="shortcut-item">
        <kbd x-text="shortcut.kbd"></kbd>
        <span x-text="shortcut.description"></span>
      </div>
    </template>
  </aside>

  <script type="module" src="../assets/js/edit.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
