<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/result.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <title>Arcana | Result</title>
</head>

<body>
  <main x-data="main">
    <section class="result" x-data="result">
      <template x-for="question in questions">
        <div class="result__blanks">
          <template x-for="blank in question.blanks">
            <span class="result__blank" :class="blank.incorrect ? 'incorrect' : 'correct'" x-text="blank.answer"></span>
          </template>
        </div>
      </template>
    </section>

    <section class="result-menu" x-data="menu" @click="handleAction($event)">
      <button class="result-menu__button" value="home">ホームへ戻る</button>
      <button class="result-menu__button" value="retry">もう一度</button>
      <button class="result-menu__button" value="review" :class="{'disabled': !canReview}">間違いのみ</button>
    </section>
  </main>

  <aside class="shortcut-bar" x-data="shortcutBar">
    <template x-for="shortcut in shortcuts" :key="shortcut.key">
      <div class="shortcut-item">
        <kbd x-text="shortcut.kbd"></kbd>
        <span x-text="shortcut.description"></span>
      </div>
    </template>
  </aside>

  <script type="module" src="../assets/js/result.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
