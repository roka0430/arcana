<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/study.css">
  <title>Arcana | Study</title>
</head>

<body>
  <main x-data="main">
    <section class="study-header">
      <div class="study-header__location">
        <span class="location__category" x-text="subject?.category_name ?? ''"></span>
        <span class="location__separator"></span>
        <span class="location__subject" x-text="subject?.name ?? ''"></span>
      </div>
      <div class="study-header__info" x-show="settings.format === 'individual'" x-text="`${index + 1} / ${questions.length}`"></div>
      <div class="study-header__menu">menu</div>
    </section>

    <section class="study-question" x-ref="question" x-html="currentQuestionHtml"></section>

    <section class="study-answer" x-show="settings.answer === 'input'">
      <input
        type="text"
        class="study-answer__input"
        autofocus="true"
        x-ref="answerInput"
        x-model="answer"
        @focus="handleFocusAnswerInput()"
        @blur="handleBlurAnswerInput()">
    </section>
  </main>

  <aside class="shortcut-bar" x-data="shortcutBar">
    <template x-for="shortcut in shortcuts" :key="shortcut.key">
      <div class="shortcut-item">
        <kbd x-text="shortcut.kbd"></kbd>
        <span x-text="shortcut.description"></span>
      </div>
    </template>
  </aside>

  <script type="module" src="../assets/js/study.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
